name: Assemble remaining app sources

on:
  push:
    paths:
      - ".github/workflows/assemble-appjs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild app.js files
        shell: bash
        run: |
          cat .staging/appjs.part01 .staging/appjs.part02 .staging/appjs.part03 | base64 -d > /tmp/appjs.zip
          unzip -o /tmp/appjs.zip -d .
          rm -rf .staging
          rm -f .github/workflows/assemble-appjs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add remaining app runtime sources"
          git push
